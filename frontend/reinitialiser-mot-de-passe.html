<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nouveau mot de passe - MeetSkills</title>
  <link rel="stylesheet" href="css/style.css" />
  <button class="hamburger" id="hamburger" onclick="toggleMenu()">☰</button>
</head>
<body class="auth-page">

  <div class="auth-container">

    <div class="auth-logo">
      <a href="index.html">
        <svg width="32" height="32" viewBox="0 0 200 200">
          <g fill="none" stroke="#3CB371" stroke-width="14" stroke-linecap="round">
            <path d="M100 100 C 100 60, 70 30, 40 35"/>
            <path d="M100 100 C 100 60, 120 30, 150 35"/>
            <path d="M100 100 C 140 100, 170 70, 165 40"/>
            <path d="M100 100 C 140 100, 170 130, 165 160"/>
            <path d="M100 100 C 100 140, 130 170, 160 165"/>
            <path d="M100 100 C 100 140, 80 170, 50 165"/>
            <path d="M100 100 C 60 100, 30 130, 35 160"/>
            <path d="M100 100 C 60 100, 30 70, 35 40"/>
          </g>
        </svg>
        <span>MEETSKILLS</span>
      </a>
    </div>

    <div class="auth-card">
      <h1 class="auth-title">Nouveau mot de passe</h1>
      <p class="auth-subtitle">Choisissez un nouveau mot de passe pour votre compte.</p>

      <div id="errorMsg" class="error-msg" style="display:none;"></div>
      <div id="successMsg" class="success-msg" style="display:none;"></div>

      <div id="formFields">
        <div class="form-group">
          <label>Nouveau mot de passe</label>
          <div class="password-field">
            <input type="password" id="password" placeholder="••••••••" oninput="checkPasswordStrength()" />
            <button type="button" class="password-toggle" onclick="togglePassword('password', this)" aria-label="Afficher le mot de passe">👁️</button>
          </div>
          <ul id="passwordRules" class="password-rules">
            <li id="rule-length">Au moins 8 caractères</li>
            <li id="rule-upper">Une majuscule</li>
            <li id="rule-lower">Une minuscule</li>
            <li id="rule-digit">Un chiffre</li>
            <li id="rule-special">Un caractère spécial (!@#$...)</li>
          </ul>
        </div>

        <div class="form-group">
          <label>Confirmer le mot de passe</label>
          <div class="password-field">
            <input type="password" id="passwordConfirm" placeholder="••••••••" oninput="checkPasswordMatch()" />
            <button type="button" class="password-toggle" onclick="togglePassword('passwordConfirm', this)" aria-label="Afficher le mot de passe">👁️</button>
          </div>
          <p id="passwordMatchMsg" class="password-match-msg"></p>
        </div>

        <button class="btn btn--primary btn--full" id="confirmBtn" onclick="handleResetConfirm()">
          Réinitialiser le mot de passe
        </button>
      </div>

      <p class="auth-footer">
        <a href="connexion.html" class="form-link">← Retour à la connexion</a>
      </p>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script>
    const PASSWORD_RULES = {
      length: v => v.length >= 8,
      upper: v => /[A-Z]/.test(v),
      lower: v => /[a-z]/.test(v),
      digit: v => /[0-9]/.test(v),
      special: v => /[^A-Za-z0-9]/.test(v),
    };

    function togglePassword(fieldId, btn) {
      const input = document.getElementById(fieldId);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.textContent = isHidden ? '🙈' : '👁️';
      btn.setAttribute('aria-label', isHidden ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
    }

    function checkPasswordStrength() {
      const value = document.getElementById('password').value;
      let allValid = true;
      for (const rule in PASSWORD_RULES) {
        const valid = PASSWORD_RULES[rule](value);
        const li = document.getElementById(`rule-${rule}`);
        li.classList.toggle('valid', valid);
        if (!valid) allValid = false;
      }
      checkPasswordMatch();
      return allValid;
    }

    function isPasswordStrong(value) {
      return Object.values(PASSWORD_RULES).every(rule => rule(value));
    }

    function checkPasswordMatch() {
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('passwordConfirm').value;
      const msg = document.getElementById('passwordMatchMsg');
      if (!confirm) { msg.textContent = ''; return true; }
      const match = password === confirm;
      msg.textContent = match ? '✓ Les mots de passe correspondent' : '✗ Les mots de passe ne correspondent pas';
      msg.classList.toggle('valid', match);
      msg.classList.toggle('invalid', !match);
      return match;
    }

    // Lecture de uid et token depuis le lien envoye par email
    const params = new URLSearchParams(window.location.search);
    const uid = params.get('uid');
    const token = params.get('token');

    if (!uid || !token) {
      document.getElementById('formFields').style.display = 'none';
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = 'Ce lien de réinitialisation est invalide ou incomplet. Merci de refaire une demande.';
      errorMsg.style.display = 'block';
    }

    async function handleResetConfirm() {
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('passwordConfirm').value;
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      const btn = document.getElementById('confirmBtn');

      errorMsg.style.display = 'none';

      if (!isPasswordStrong(password)) {
        errorMsg.textContent = 'Le mot de passe ne respecte pas les règles de sécurité indiquées ci-dessus.';
        errorMsg.style.display = 'block';
        return;
      }
      if (password !== passwordConfirm) {
        errorMsg.textContent = 'Les mots de passe ne correspondent pas.';
        errorMsg.style.display = 'block';
        return;
      }

      btn.textContent = 'Réinitialisation...';
      btn.disabled = true;

      const result = await confirmerResetPassword(uid, token, password);

      if (result.status === 204) {
        document.getElementById('formFields').style.display = 'none';
        successMsg.textContent = 'Votre mot de passe a été réinitialisé avec succès. Vous pouvez maintenant vous connecter.';
        successMsg.style.display = 'block';
        setTimeout(() => { window.location.href = 'connexion.html'; }, 2500);
      } else {
        const errors = Object.values(result.data || {}).flat().join(' ');
        errorMsg.textContent = errors || 'Ce lien a peut-être expiré. Merci de refaire une demande de réinitialisation.';
        errorMsg.style.display = 'block';
        btn.textContent = 'Réinitialiser le mot de passe';
        btn.disabled = false;
      }
    }
  </script>
  <script>
  function toggleMenu() {
    const nav = document.getElementById('mainNav');
    nav.classList.toggle('open');
  }
</script>

</body>
</html>
