<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inscription - MeetSkills</title>
  <link rel="stylesheet" href="css/style.css" />
  <button class="hamburger" id="hamburger" onclick="toggleMenu()">☰</button>
</head>
<body class="auth-page">

  <div class="auth-container" style="max-width:520px;">

    <div class="auth-logo">
      <a href="index.html">
        <svg width="32" height="32" viewBox="0 0 200 200">
          <g fill="none" stroke="#3CB371" stroke-width="14" stroke-linecap="round">
            <path d="M100 100 C 100 60, 70 30, 40 35"/>
            <path d="M100 100 C 100 60, 120 30, 150 35"/>
            <path d="M100 100 C 140 100, 170 70, 165 40"/>
            <path d="M100 100 C 140 100, 170 130, 165 160"/>
            <path d="M100 100 C 100 140, 130 170, 160 165"/>
            <path d="M100 100 C 100 140, 80 170, 50 165"/>
            <path d="M100 100 C 60 100, 30 130, 35 160"/>
            <path d="M100 100 C 60 100, 30 70, 35 40"/>
          </g>
        </svg>
        <span>MEETSKILLS</span>
      </a>
    </div>

    <div class="auth-card">
      <h1 class="auth-title">Créer un compte</h1>
      <p class="auth-subtitle">Rejoignez la communauté étudiante du Bénin</p>

      <div id="errorMsg" class="error-msg" style="display:none;"></div>

      <div class="form-row">
        <div class="form-group">
          <label>Nom</label>
          <input type="text" id="nom" placeholder="HANTO" />
        </div>
        <div class="form-group">
          <label>Prénom</label>
          <input type="text" id="prenom" placeholder="Jordy" />
        </div>
      </div>

      <div class="form-group">
        <label>Adresse e-mail universitaire</label>
        <input type="email" id="email" placeholder="prenom.nom@ifri.uac.bj" />
      </div>

      <div class="form-group">
        <label>Numéro de téléphone</label>
        <input type="tel" id="telephone" placeholder="+229 01 XX XX XX XX" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Université / Institut</label>
          <select id="universite" onchange="toggleAutre('universite')">
            <option value="" disabled selected>Choisir une université</option>
            <option value="IFRI - UAC">IFRI - UAC</option>
            <option value="EPAC - UAC">EPAC - UAC</option>
            <option value="ENEAM - UAC">ENEAM - UAC</option>
            <option value="Université d'Abomey-Calavi (UAC)">Université d'Abomey-Calavi (UAC)</option>
            <option value="Université de Parakou (UP)">Université de Parakou (UP)</option>
            <option value="UNSTIM Abomey">UNSTIM Abomey</option>
            <option value="Université Nationale d'Agriculture (UNA)">Université Nationale d'Agriculture (UNA)</option>
            <option value="Université Catholique de l'Afrique de l'Ouest (UCAO)">Université Catholique de l'Afrique de l'Ouest (UCAO)</option>
            <option value="ESGIS">ESGIS</option>
            <option value="Groupe ISM">Groupe ISM</option>
            <option value="Institut CERCO">Institut CERCO</option>
            <option value="autre">Autre (préciser)</option>
          </select>
          <input type="text" id="universiteAutre" placeholder="Précisez votre université" style="display:none; margin-top:8px;" />
        </div>
        <div class="form-group">
          <label>Filière</label>
          <select id="filiere" onchange="toggleAutre('filiere')">
            <option value="" disabled selected>Choisir une filière</option>
            <option value="Informatique">Informatique</option>
            <option value="Génie Logiciel">Génie Logiciel</option>
            <option value="Réseaux et Télécommunications">Réseaux et Télécommunications</option>
            <option value="Gestion / Management">Gestion / Management</option>
            <option value="Comptabilité">Comptabilité</option>
            <option value="Économie">Économie</option>
            <option value="Droit">Droit</option>
            <option value="Médecine">Médecine</option>
            <option value="Génie Civil">Génie Civil</option>
            <option value="Génie Électrique">Génie Électrique</option>
            <option value="Agronomie">Agronomie</option>
            <option value="Marketing / Commerce International">Marketing / Commerce International</option>
            <option value="Sociologie">Sociologie</option>
            <option value="autre">Autre (préciser)</option>
          </select>
          <input type="text" id="filiereAutre" placeholder="Précisez votre filière" style="display:none; margin-top:8px;" />
        </div>
      </div>

            <div class="form-group">
        <label>Mot de passe</label>
        <div class="password-field">
          <input type="password" id="password" placeholder="••••••••" oninput="checkPasswordStrength()" />
          <button type="button" class="password-toggle" onclick="togglePassword('password', this)" aria-label="Afficher le mot de passe">👁️</button>
        </div>
        <ul id="passwordRules" class="password-rules">
          <li id="rule-length">Au moins 8 caractères</li>
          <li id="rule-upper">Une majuscule</li>
          <li id="rule-lower">Une minuscule</li>
          <li id="rule-digit">Un chiffre</li>
          <li id="rule-special">Un caractère spécial (!@#$...)</li>
        </ul>
      </div>

      <div class="form-group">
        <label>Confirmer le mot de passe</label>
        <div class="password-field">
          <input type="password" id="passwordConfirm" placeholder="••••••••" oninput="checkPasswordMatch()" />
          <button type="button" class="password-toggle" onclick="togglePassword('passwordConfirm', this)" aria-label="Afficher le mot de passe">👁️</button>
        </div>
        <p id="passwordMatchMsg" class="password-match-msg"></p>
      </div>

      <button class="btn btn--primary btn--full" id="registerBtn" onclick="handleRegister()">
        Créer mon compte
      </button>

      <p class="auth-footer">
        Déjà inscrit ? <a href="connexion.html" class="form-link">Se connecter</a>
      </p>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script>
    const PASSWORD_RULES = {
      length: v => v.length >= 8,
      upper: v => /[A-Z]/.test(v),
      lower: v => /[a-z]/.test(v),
      digit: v => /[0-9]/.test(v),
      special: v => /[^A-Za-z0-9]/.test(v),
    };

    function togglePassword(fieldId, btn) {
      const input = document.getElementById(fieldId);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.textContent = isHidden ? '🙈' : '👁️';
      btn.setAttribute('aria-label', isHidden ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
    }

    function checkPasswordStrength() {
      const value = document.getElementById('password').value;
      let allValid = true;
      for (const rule in PASSWORD_RULES) {
        const valid = PASSWORD_RULES[rule](value);
        const li = document.getElementById(`rule-${rule}`);
        li.classList.toggle('valid', valid);
        if (!valid) allValid = false;
      }
      checkPasswordMatch();
      return allValid;
    }

    function isPasswordStrong(value) {
      return Object.values(PASSWORD_RULES).every(rule => rule(value));
    }

    function checkPasswordMatch() {
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('passwordConfirm').value;
      const msg = document.getElementById('passwordMatchMsg');
      if (!confirm) {
        msg.textContent = '';
        return true;
      }
      const match = password === confirm;
      msg.textContent = match ? '✓ Les mots de passe correspondent' : '✗ Les mots de passe ne correspondent pas';
      msg.classList.toggle('valid', match);
      msg.classList.toggle('invalid', !match);
      return match;
    }

    function toggleAutre(field) {
      const select = document.getElementById(field);
      const autreInput = document.getElementById(field + 'Autre');
      autreInput.style.display = select.value === 'autre' ? 'block' : 'none';
      if (select.value === 'autre') autreInput.focus();
    }

    function getSelectValue(field) {
      const select = document.getElementById(field);
      if (select.value === 'autre') {
        return document.getElementById(field + 'Autre').value.trim();
      }
      return select.value;
    }

    async function handleRegister() {
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('registerBtn');

      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('passwordConfirm').value;

      const data = {
        nom: document.getElementById('nom').value.trim(),
        prenom: document.getElementById('prenom').value.trim(),
        email: document.getElementById('email').value.trim(),
        telephone: document.getElementById('telephone').value.trim(),
        universite: getSelectValue('universite'),
        filiere: getSelectValue('filiere'),
        niveau: 'licence',
        password: password,
      };

      if (!data.nom || !data.prenom || !data.email || !data.password) {
        errorMsg.textContent = 'Veuillez remplir tous les champs obligatoires.';
        errorMsg.style.display = 'block';
        return;
      }

      if (!isPasswordStrong(password)) {
        errorMsg.textContent = 'Le mot de passe ne respecte pas les règles de sécurité indiquées ci-dessus.';
        errorMsg.style.display = 'block';
        return;
      }

      if (password !== passwordConfirm) {
        errorMsg.textContent = 'Les mots de passe ne correspondent pas.';
        errorMsg.style.display = 'block';
        return;
      }

      btn.textContent = 'Création...';
      btn.disabled = true;

      const result = await register(data);

      if (result.status === 201) {
        // Connexion automatique après inscription
        const success = await login(data.email, data.password);
        if (success) {
          window.location.href = 'index.html';
          return;
        }
        // Le compte a été créé mais l'auto-connexion a échoué :
        // on informe l'utilisateur au lieu de rester bloqué en silence.
        errorMsg.textContent = 'Votre compte a été créé, mais la connexion automatique a échoué. Veuillez vous connecter manuellement.';
        errorMsg.style.display = 'block';
        setTimeout(() => { window.location.href = 'connexion.html'; }, 2000);
      } else {
        // Messages d'erreur détaillés, champ par champ (ex: "email: Cette adresse existe déjà.")
        const fieldLabels = {
          email: 'E-mail', password: 'Mot de passe', nom: 'Nom', prenom: 'Prénom',
          telephone: 'Téléphone', universite: 'Université', filiere: 'Filière', niveau: 'Niveau'
        };
        const errors = Object.entries(result.data || {})
          .map(([field, msgs]) => `${fieldLabels[field] || field} : ${[].concat(msgs).join(' ')}`)
          .join(' | ');
        errorMsg.textContent = errors || 'Une erreur est survenue. Veuillez réessayer.';
        errorMsg.style.display = 'block';
        btn.textContent = 'Créer mon compte';
        btn.disabled = false;
      }
    }
  </script>
  <script>
  function toggleMenu() {
    const nav = document.getElementById('mainNav');
    nav.classList.toggle('open');
  }
</script>

</body>
</html>
